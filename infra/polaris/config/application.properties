polaris.authentication.token-broker.type=rsa-key-pair
polaris.authentication.token-broker.rsa-key-pair.public-key-file=/workspace/keys/public.key
polaris.authentication.token-broker.rsa-key-pair.private-key-file=/workspace/keys/private.key

polaris.realm-context.require-header=true

polaris.features."DROP_WITH_PURGE_ENABLED"=true